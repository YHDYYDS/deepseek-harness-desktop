# electron-builder configuration for the dsh desktop shell.
# The host (full web composition) runs inside the Electron main process, so the
# packaged app must carry the production node_modules of `@deepseek-ai/dsh`
# (its transitive `dsh-*` bundles and the built `dsh-web-frontend` dist).

appId: com.deepseek.harness.desktop
productName: DeepSeek Harness
copyright: Copyright © 2026 DeepSeek

directories:
  output: dist
  buildResources: build

files:
  - lib/**/*.js
  - lib/**/*.js.map
  - main.cjs
  - loading.html
  - build/icon.png
  - package.json
  - '!src/**'
  - '!scripts/**'

# The harness host relies on real filesystem paths everywhere — the healed
# profile fallback symlinks plugin packages, workflow/code-runtime workers,
# koffi FFI bindings, and the ESM entry all need plain files. Shipping
# unpacked (asar: false) is the standard layout for apps that embed a Node
# server of this shape (cf. VS Code); it removes the whole asar failure class.
asar: false

npmRebuild: false

# The update feed. Declaring it makes electron-builder emit the channel file
# (latest.yml) next to the installers; CI uploads it to each release and the
# app reads it via setFeedURL (src/updater.ts). Nothing is auto-published:
# the dist script always passes --publish never.
publish:
  provider: github
  owner: YHDYYDS
  repo: deepseek-harness-desktop

win:
  target:
    - nsis
    - portable
  icon: build/icon.ico

# One-click NSIS on purpose: it is the electron-updater battle-tested layout —
# silent /S --updated reinstalls work, per-user installs avoid UAC on update,
# and the installer relaunches the app afterwards. Assisted installers make
# the auto-update path unreliable, so directory choice is not offered.
nsis:
  oneClick: true
  artifactName: ${productName}-${version}-setup.${ext}

portable:
  artifactName: ${productName}-${version}-portable.${ext}
