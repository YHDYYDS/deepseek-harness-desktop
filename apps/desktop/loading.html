<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src file: data:; script-src 'unsafe-inline'" />
  <title>DeepSeek Harness</title>
  <style>
    :root {
      --brand: #4d6bfe;
      --track: rgba(77, 107, 254, 0.18);
      --text: #1f2328;
      --muted: #717887;
      --bg: #eef0f6;
      --err: #d93026;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --track: rgba(122, 148, 255, 0.18);
        --text: #e6e8ee;
        --muted: #8a93a5;
        --bg: #10141c;
        --err: #ff6b5e;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      user-select: none;
      overflow: hidden;
    }
    .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 32px;
    }
    .logo {
      width: 64px;
      height: 64px;
      animation: breathe 2.4s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.88; }
    }
    h1 {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }
    .status-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 22px;
    }
    .spinner {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2.5px solid var(--track);
      border-top-color: var(--brand);
      animation: spin 0.85s linear infinite;
      flex: 0 0 auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .spinner.error { border-top-color: var(--err); }
    #status {
      font-size: 13px;
      color: var(--muted);
      max-width: 480px;
      text-align: center;
      line-height: 1.6;
    }
    #status.error { color: var(--err); }
  </style>
</head>
<body>
  <main class="stage">
    <img class="logo" src="build/icon.png" alt="DeepSeek Harness" />
    <h1>DeepSeek Harness</h1>
    <div class="status-row">
      <span class="spinner" id="spinner"></span>
      <span id="status">正在启动 DeepSeek Harness…</span>
    </div>
  </main>
  <script>
    // Called from the Electron main process via webContents.executeJavaScript.
    window.setBootStatus = function (text, isError) {
      var el = document.getElementById('status')
      var spin = document.getElementById('spinner')
      el.textContent = text || ''
      el.classList.toggle('error', Boolean(isError))
      spin.classList.toggle('error', Boolean(isError))
    }
  </script>
</body>
</html>
