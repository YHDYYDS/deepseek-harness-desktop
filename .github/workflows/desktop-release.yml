name: desktop-release

# Builds the Windows desktop shell and attaches the installers to a GitHub
# release when a `v*` tag is pushed. Manual runs (workflow_dispatch) upload the
# artifacts to the run instead.
#
# GitHub-hosted runners have unrestricted npm access, so no registry mirrors
# are needed here (the mirrors in apps/desktop/README.md target restricted
# networks). Signing stays disabled: community builds ship unsigned and
# Windows SmartScreen will show an "unknown publisher" prompt.
# NOTE: if this workflow stops showing up under Actions, re-push the file once —
# GitHub occasionally skips first-seen registration.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build harness packages and web frontend
        run: pnpm run build

      - name: Build desktop installers
        working-directory: apps/desktop
        run: pnpm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload artifacts (manual runs)
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: apps/desktop/dist/*.exe

      - name: Attach to release (tag runs)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/desktop/dist/*.exe
